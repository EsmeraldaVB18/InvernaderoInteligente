<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="StyleLogin.css">
  <link rel="stylesheet" href="ContraseñaStyle.css">
  <title>Invernadero Inteligente — Recuperar contraseña</title>
</head>

<body>
  <div class="fp-box">
    <div class="fp-logo">🌿</div>
    <div class="fp-title">Recuperar contraseña</div>
    <div class="fp-sub">Ingresa tu correo y te mostraremos el enlace para restablecer tu acceso.</div>

    <!-- Formulario correo -->
    <div id="step1">
      <div class="field">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="tu@correo.com" autocomplete="email">
        <div class="hint">Ingresa el correo con el que te registraste.</div>
      </div>

      <div id="msgErr" class="msg-err" style="display:none;"></div>

      <button class="btn-send" id="btnEnviar">Recuperar contraseña</button>

      <!-- Resultado exitoso -->
      <div class="msg-ok" id="msgOk" style="display:none;">
        <div style="font-size:1.1rem; margin-bottom:.5rem;">✅ ¡Solicitud procesada!</div>
        <div style="font-size:.88rem; color:#374151; margin-bottom:.8rem;">
          Usa el siguiente enlace para crear tu nueva contraseña:
        </div>
        <a id="enlaceReset" href="#"
          style="word-break:break-all; color:#2e7d32; font-size:.84rem; font-weight:600;"></a>
        <div style="font-size:.78rem; color:#888; margin-top:.8rem;">
          ⏱ Este enlace es válido por 30 minutos.
        </div>
      </div>
    </div>

    <div style="text-align:center;margin-top:1.4rem">
      <a href="login.html" class="a-back">← Volver al inicio de sesión</a>
    </div>
  </div>

  <style>
    .msg-err {
      background: #fee2e2;
      color: #991b1b;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: .88rem;
      text-align: center;
      margin-bottom: .6rem;
    }

    #btnEnviar:disabled {
      opacity: .6;
      cursor: not-allowed;
    }
  </style>

  <script>
    const btnEnviar = document.getElementById('btnEnviar');
    const emailInput = document.getElementById('email');
    const msgErr = document.getElementById('msgErr');
    const msgOk = document.getElementById('msgOk');
    const enlaceReset = document.getElementById('enlaceReset');

    function mostrarError(txt) {
      msgErr.textContent = txt;
      msgErr.style.display = 'block';
      msgOk.style.display = 'none';
    }

    function limpiarError() {
      msgErr.style.display = 'none';
    }

    emailInput.addEventListener('input', limpiarError);

    btnEnviar.addEventListener('click', () => {
      const correo = emailInput.value.trim();
      if (!correo || !correo.includes('@')) {
        mostrarError('Ingresa un correo electrónico válido.');
        return;
      }

      btnEnviar.disabled = true;
      btnEnviar.textContent = 'Enviando...';
      limpiarError();

      fetch('php/recuperar_password.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'correo=' + encodeURIComponent(correo)
      })
        .then(r => r.json())
        .then(data => {
          if (data.success) {
            // Mostrar enlace 
            if (data.enlace) {
              enlaceReset.href = data.enlace;
              enlaceReset.textContent = data.enlace;
            } else {
              enlaceReset.style.display = 'none';
            }
            msgOk.style.display = 'block';
            document.getElementById('step1').querySelector('.field').style.display = 'none';
            btnEnviar.style.display = 'none';
          } else {
            mostrarError(data.message || 'Ocurrió un error. Intenta de nuevo.');
          }
        })
        .catch(() => {
          mostrarError('Error de conexión con el servidor.');
        })
        .finally(() => {
          btnEnviar.disabled = false;
          btnEnviar.textContent = 'Recuperar contraseña';
        });
    });
  </script>
</body>

</html>
